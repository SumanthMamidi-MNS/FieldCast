[project]
name = "fieldcast"
version = "0.2.0"
description = "FieldCast: panchayat-level weather downscaling from block-level forecasts (SIH26074)"
requires-python = ">=3.11"
# Runtime only. This is what Vercel installs for the deployed API, so it stays
# small: the API reads the precomputed serving bundle and evaluates the trees
# with numpy. The training stack lives in the `pipeline` extra.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
serve = [
    "uvicorn>=0.32",
]
pipeline = [
    "tenacity>=9.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "scipy>=1.14",
    "typer>=0.12",
    "rich>=13.9",
    "pillow>=10",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "respx>=0.21",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
