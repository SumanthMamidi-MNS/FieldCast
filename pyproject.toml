[project]
name = "panchayat-downscaling"
version = "0.1.0"
description = "Panchayat-level weather downscaling from block-level forecasts (SIH26074)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "scipy>=1.14",
    "typer>=0.12",
    "rich>=13.9",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
